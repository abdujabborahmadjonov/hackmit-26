name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Superseded pull-request runs are cancelled; runs on main always finish so the
# branch history keeps a result for every commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # CI never talks to a hosted embedding provider: the hashing provider is
  # deterministic, offline and free.
  EMBEDDING_PROVIDER: hashing
  JWT_SECRET: ci-only-secret-nothing-real-is-ever-signed-with-this
  # The suite currently sits at ~78% line coverage of backend/app.
  COVERAGE_MIN: "75"

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: Requirements are pinned to exact versions
        run: |
          unpinned=$(grep -vE '^\s*(#|$|-r )' requirements.txt | grep -vE '==' || true)
          if [ -n "$unpinned" ]; then
            echo "::error::these requirements are not pinned with =="
            echo "$unpinned"
            exit 1
          fi

      - name: No .env file is committed
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error file=backend/.env::a .env file is committed; secrets belong in the environment"
            exit 1
          fi

  unit:
    name: Unit tests (no services)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: The app imports and produces a valid OpenAPI schema
        run: |
          python - <<'PY'
          from app.main import app

          schema = app.openapi()
          paths = schema["paths"]
          assert len(paths) > 20, f"only {len(paths)} paths in the schema"
          for required in ("/auth/login", "/recommendations", "/search/teachers"):
              assert required in paths, f"{required} is missing from the OpenAPI schema"
          print(f"OpenAPI {schema['openapi']}: {len(paths)} paths")
          PY

      # Also proves the integration tests skip cleanly (rather than error) when
      # no database is around, which is what a contributor sees locally.
      - name: pytest -m "not integration"
        run: pytest -m "not integration" -v --durations=10

  tests:
    name: Tests + coverage (PostgreSQL/pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: edumatch
          POSTGRES_PASSWORD: edumatch
          POSTGRES_DB: edumatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edumatch -d edumatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://edumatch:edumatch@localhost:5432/edumatch_test
      TEST_DATABASE_URL: postgresql+asyncpg://edumatch:edumatch@localhost:5432/edumatch_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The integration tests skip themselves when the database is unreachable,
      # so assert it is really there before trusting a green run.
      - name: Database is reachable
        run: |
          python - <<'PY'
          import asyncio, os
          import asyncpg

          url = os.environ["TEST_DATABASE_URL"].replace("postgresql+asyncpg", "postgresql")

          async def main() -> None:
              conn = await asyncpg.connect(url)
              print(await conn.fetchval("SELECT version()"))
              await conn.close()

          asyncio.run(main())
          PY

      - name: pytest (full suite)
        run: |
          pytest -v --durations=10 \
            --junitxml=reports/junit.xml \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov \
            --cov-fail-under="${COVERAGE_MIN}"

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Backend coverage"
            echo
            coverage report --format=markdown || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/reports/
          retention-days: 14

  migrations:
    name: Migrations (upgrade, downgrade, drift)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: edumatch
          POSTGRES_PASSWORD: edumatch
          POSTGRES_DB: edumatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edumatch -d edumatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://edumatch:edumatch@localhost:5432/edumatch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: alembic upgrade head
        run: alembic upgrade head

      # Fails when a model changed without a matching migration.
      - name: The models and the migrations agree
        run: alembic check

      - name: Single head revision
        run: |
          heads=$(alembic heads | grep -c '(head)' || true)
          if [ "$heads" != "1" ]; then
            echo "::error::expected exactly one alembic head, found ${heads}"
            alembic heads
            exit 1
          fi

      - name: downgrade base, then upgrade head again
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic check

  elasticsearch:
    name: Search engine (Elasticsearch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: edumatch
          POSTGRES_PASSWORD: edumatch
          POSTGRES_DB: edumatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edumatch -d edumatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    env:
      DATABASE_URL: postgresql+asyncpg://edumatch:edumatch@localhost:5432/edumatch_test
      TEST_DATABASE_URL: postgresql+asyncpg://edumatch:edumatch@localhost:5432/edumatch_test
      SEARCH_PROVIDER: elasticsearch
      ELASTICSEARCH_URL: http://localhost:9200
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # These tests skip themselves when the cluster is unreachable, so prove it
      # is up before treating the job as meaningful coverage.
      - name: Cluster is reachable
        run: |
          curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=60s"

      - name: pytest (Elasticsearch backend)
        run: pytest tests/test_search_elasticsearch.py -v -rs --durations=10

  docker:
    name: Docker image + end-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the image and start the stack
        run: docker compose up -d --build

      # The container runs `alembic upgrade head` before uvicorn, so a healthy
      # /health also proves the migrations applied to an empty database.
      - name: Wait for the API to come up
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 3
          done
          echo "::error::the API never became healthy"
          docker compose ps
          exit 1

      - name: Seed a small demo dataset
        run: docker compose exec -T backend python scripts/generate_demo_data.py --scale 0.02

      - name: Smoke-test the running API
        run: ./scripts/smoke_test.sh

      - name: The container runs as a non-root user
        run: |
          user=$(docker compose exec -T backend id -un | tr -d '\r')
          if [ "$user" = "root" ]; then
            echo "::error::the backend container is running as root"
            exit 1
          fi
          echo "container user: ${user}"

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 300

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans

  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory only: a newly published CVE should not block an unrelated PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install "$(grep -E '^pip-audit==' requirements-dev.txt)"

      - name: pip-audit
        run: pip-audit --requirement requirements.txt --progress-spinner off

  ci:
    name: CI
    # The single status check to require on main: it turns red if any job above
    # failed, and stays correct when jobs are added or renamed.
    needs: [lint, unit, tests, migrations, elasticsearch, docker]
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check results
        run: |
          echo "results: ${{ join(needs.*.result, ', ') }}"
          case "${{ join(needs.*.result, ',') }}" in
            *failure*|*cancelled*) echo "::error::at least one required job did not pass"; exit 1 ;;
          esac
          echo "All required jobs passed."
