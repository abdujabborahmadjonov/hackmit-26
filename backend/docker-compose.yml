# EduMatch - one command to a running backend:
#
#     docker compose up --build
#
# Optional Elasticsearch engine (SEARCH_PROVIDER=elasticsearch):
#
#     docker compose --profile elasticsearch up --build
#
name: edumatch

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: edumatch
      POSTGRES_PASSWORD: edumatch
      POSTGRES_DB: edumatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edumatch -d edumatch"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://edumatch:edumatch@postgres:5432/edumatch
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-use-a-long-random-string}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hashing}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-postgres}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_DIR: /app/storage
      STORAGE_PUBLIC_BASE_URL: http://localhost:8000/static/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/storage

  # Optional: start with `--profile elasticsearch`
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    profiles: ["elasticsearch"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  uploads:
